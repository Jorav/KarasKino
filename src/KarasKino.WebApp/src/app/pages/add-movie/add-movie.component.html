<div class="add-movie">
  <h1 class="add-movie__title">Add a Movie</h1>

  <section class="add-movie__section">
    <h2 class="add-movie__section-title">Find Movie</h2>
    <div class="add-movie__field">
      <div class="add-movie__search-wrapper">
        <input
          type="text"
          [value]="searchQuery"
          (input)="onSearchInput($any($event.target).value)"
          (focus)="showDropdown = searchResults.length > 0"
          placeholder="Search by title..." />

        <div class="add-movie__dropdown" *ngIf="showDropdown">
          <div class="add-movie__dropdown-item"
               *ngFor="let result of searchResults"
               (click)="selectSearchResult(result)">
            <img *ngIf="result.posterUrl" [src]="result.posterUrl" [alt]="result.title" />
            <div *ngIf="!result.posterUrl" class="add-movie__dropdown-no-poster"></div>
            <div class="add-movie__dropdown-info">
              <span class="add-movie__dropdown-title">{{ result.title }}</span>
              <span class="add-movie__dropdown-meta">
                <span *ngIf="result.releaseYear">{{ result.releaseYear }}</span>
                <span *ngIf="result.releaseYear && result.director"> · </span>
                <span *ngIf="result.director">{{ result.director }}</span>
              </span>
            </div>
          </div>
        </div>
      </div>
      <span class="add-movie__error" *ngIf="tmdbError">{{ tmdbError }}</span>
    </div>
  </section>

  <app-movie-form
    [initialValue]="formInitialValue"
    [posterPreview]="posterPreview"
    [isSaving]="isSaving"
    [saveError]="saveError"
    saveButtonLabel="Save Movie"
    (save)="onSave($event)"
    (cancel)="onCancel()">
  </app-movie-form>
</div>
