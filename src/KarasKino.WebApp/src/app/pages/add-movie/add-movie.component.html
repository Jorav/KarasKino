<div class="add-movie">
  <h1 class="add-movie__title">Add a Movie</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- IMDB Lookup -->
    <section class="add-movie__section">
      <h2 class="add-movie__section-title">IMDB Lookup</h2>
      <div class="add-movie__field">
        <label for="imdbLink">IMDB Link</label>
        <div class="add-movie__imdb-row">
          <input id="imdbLink"
                 formControlName="imdbLink"
                 type="text"
                 placeholder="https://www.imdb.com/title/tt0111161/" />
          <button type="button"
                  class="btn btn--secondary"
                  (click)="lookupMovie()"
                  [disabled]="isLoadingTmdb || isLoadingDb">
            {{ isLoadingTmdb ? 'Looking up...' : 'Lookup' }}
          </button>
          <button type="button"
                  class="btn btn--secondary"
                  (click)="getFromDb()"
                  [disabled]="isLoadingTmdb || isLoadingDb">
            {{ isLoadingDb ? 'Loading...' : 'Get' }}
          </button>
        </div>
        <span class="add-movie__error" *ngIf="tmdbError">{{ tmdbError }}</span>
        <span class="add-movie__db-result" *ngIf="dbResult">{{ dbResult }}</span>
      </div>
    </section>

    <!-- Movie Details -->
    <section class="add-movie__section">
      <h2 class="add-movie__section-title">Movie Details</h2>

      <div class="add-movie__details-grid">
        <div class="add-movie__poster-preview" *ngIf="posterPreview">
          <img [src]="posterPreview" [alt]="form.get('title')?.value" />
        </div>

        <div class="add-movie__fields">
          <div class="add-movie__field">
            <label for="title">Title</label>
            <input id="title" formControlName="title" type="text" />
          </div>

          <div class="add-movie__field">
            <label for="director">Director</label>
            <input id="director" formControlName="director" type="text" />
          </div>

          <div class="add-movie__field">
            <label for="releaseDate">Year</label>
            <input id="releaseDate" formControlName="releaseDate" type="text" />
          </div>

          <div class="add-movie__field">
            <label for="runtime">Runtime (minutes)</label>
            <input id="runtime" formControlName="runtime" type="number" />
          </div>

          <div class="add-movie__field">
            <label for="description">Description</label>
            <textarea id="description" formControlName="description" rows="4"></textarea>
          </div>

          <div class="add-movie__field" *ngIf="genres.length > 0">
            <label>Genres</label>
            <div class="add-movie__genres">
              <span class="add-movie__genre" *ngFor="let genre of genres">{{ genre }}</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Watched By -->
    <section class="add-movie__section">
      <h2 class="add-movie__section-title">Watched By</h2>
      <div class="add-movie__watched">
        <label class="add-movie__checkbox">
          <input type="checkbox" formControlName="watchedByKara" />
          <span>Kara</span>
        </label>
        <label class="add-movie__checkbox">
          <input type="checkbox" formControlName="watchedByJohan" />
          <span>Johan</span>
        </label>
      </div>
    </section>

    <!-- Submit -->
    <div class="add-movie__actions">
      <span class="add-movie__error" *ngIf="saveError">{{ saveError }}</span>
      <button type="submit" class="btn btn--primary" [disabled]="form.invalid || isSaving">
        {{ isSaving ? 'Saving...' : 'Save Movie' }}
      </button>
    </div>

  </form>
</div>
