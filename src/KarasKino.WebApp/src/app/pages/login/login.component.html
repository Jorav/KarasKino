<div class="login">
  <h1 class="login__title">{{ isRegister ? 'Register' : 'Sign In' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="login__field">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" placeholder="you@example.com" />
    </div>

    <div class="login__field">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" placeholder="••••••••" />
    </div>

    <span class="login__error" *ngIf="error">{{ error }}</span>

    <div class="login__actions">
      <button type="submit" class="btn btn--primary" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Please wait...' : (isRegister ? 'Register' : 'Sign In') }}
      </button>
    </div>
  </form>

  <div class="login__divider">or</div>

  <button class="btn btn--google" (click)="loginWithGoogle()">
    Sign in with Google
  </button>

  <p class="login__toggle">
    {{ isRegister ? 'Already have an account?' : "Don't have an account?" }}
    <a (click)="toggleMode()">{{ isRegister ? 'Sign in' : 'Register' }}</a>
  </p>
</div>
